<!DOCTYPE html>
 <html>
<head>
    <title>First Table</title>
 </head>
<body>


<table border="1" cellspacing="0" cellpadding="15">
    
	<tr>
        <td>1</td>
        <td>2</td>
        <td>3</td>
    </tr>
    
	<tr>
        <td>4</td>
        <td>5</td>
        <td>6</td>
   </tr>
    
	<tr>
        <td>7</td>
        <td>8</td>
        <td>9</td>
    </tr>
</table>

<table border="1" cellspacing="0" cellpadding="15">
    <tr>
        <td colspan="2">A</td>
        <td>B</td>
   </tr>
    <tr>
        <td rowspan="2">C</td>
        <td>D</td>
        <td>E</td>
      </tr>
    <tr>
        <td>G</td>
        <td>F</td>
     </tr>
</table>

</body>
</html>
